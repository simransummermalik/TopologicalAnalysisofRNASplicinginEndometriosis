<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="826" viewBox="0 0 1224 826" role="img" aria-labelledby="title description">
<title id="title">Splice graph decomposition for sample case_02 and gene GENE_DEMO</title>
<desc id="description">Three aligned directed splice graphs show the observed normalized signal, gradient component, and cycle component. Every panel uses the same nodes, edges, direction, edge IDs, and line-width scale.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
  </marker>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .mono { font-family: "Courier New", Courier, monospace; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="serif" x="48" y="42" font-size="24" font-weight="700" fill="#111111">Splice graph decomposition: GENE_DEMO</text>
<text class="serif" x="48" y="70" font-size="15" fill="#111111">Sample: case_02</text>
<line x1="48" y1="88" x2="1176.0" y2="88" stroke="#111111" stroke-width="1"/>
<text class="serif" x="48" y="113" font-size="14" fill="#111111">Nodes: 3   ·   Junctions: 3   ·   Cycle fraction: 0.1111   ·   Mathematical checks: PASS</text>
<text class="serif" x="48" y="143" font-size="13" fill="#111111">Same graph layout and edge IDs in every panel. Line width uses one shared absolute-value scale.</text>
<line x1="48" y1="163" x2="84" y2="163" stroke="#111111" stroke-width="2.2"/>
<text class="serif" x="92" y="167" font-size="12" fill="#111111">solid = positive</text>
<line x1="218" y1="163" x2="254" y2="163" stroke="#111111" stroke-width="2.2" stroke-dasharray="7 5"/>
<text class="serif" x="262" y="167" font-size="12" fill="#111111">dashed = negative</text>
<text class="serif" x="410" y="167" font-size="12" fill="#111111">Arrows always retain the stored biological junction direction.</text>
<g aria-label="1. Observed signal">
<rect x="48.0" y="180.0" width="360.0" height="365.0" fill="#ffffff" stroke="#777777" stroke-width="0.8"/>
<text class="serif" x="64.0" y="207" font-size="17" font-weight="700" fill="#111111">1. Observed signal</text>
<text class="serif" x="64.0" y="230" font-size="12" fill="#333333">Normalized junction usage (F)</text>
<path d="M 140.0 405.0 Q 163.0 327.0 186.0 405.0" fill="none" stroke="#111111" stroke-width="3.60" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="126.0" y="332.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="163.0" y="345.0" text-anchor="middle" font-size="10" fill="#111111">J1 +0.333</text>
<path d="M 140.0 405.0 Q 228.0 309.0 316.0 405.0" fill="none" stroke="#111111" stroke-width="3.60" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="191.0" y="314.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="228.0" y="327.0" text-anchor="middle" font-size="10" fill="#111111">J2 +0.333</text>
<path d="M 270.0 405.0 Q 293.0 327.0 316.0 405.0" fill="none" stroke="#111111" stroke-width="3.60" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="256.0" y="332.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="293.0" y="345.0" text-anchor="middle" font-size="10" fill="#111111">J3 +0.333</text>
<rect x="56.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="98.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E1<title>E1</title></text>
<rect x="186.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="228.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E2<title>E2</title></text>
<rect x="316.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="358.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E3<title>E3</title></text>
</g>
<g aria-label="2. Gradient component">
<rect x="432.0" y="180.0" width="360.0" height="365.0" fill="#ffffff" stroke="#777777" stroke-width="0.8"/>
<text class="serif" x="448.0" y="207" font-size="17" font-weight="700" fill="#111111">2. Gradient component</text>
<text class="serif" x="448.0" y="230" font-size="12" fill="#333333">Part explained by node values (F_grad)</text>
<path d="M 524.0 405.0 Q 547.0 327.0 570.0 405.0" fill="none" stroke="#111111" stroke-width="3.12" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
