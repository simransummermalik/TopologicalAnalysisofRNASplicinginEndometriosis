<text class="mono" x="547.0" y="345.0" text-anchor="middle" font-size="10" fill="#111111">J1 +0.222</text>
<path d="M 524.0 405.0 Q 612.0 309.0 700.0 405.0" fill="none" stroke="#111111" stroke-width="4.00" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="575.0" y="314.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="612.0" y="327.0" text-anchor="middle" font-size="10" fill="#111111">J2 +0.444</text>
<path d="M 654.0 405.0 Q 677.0 327.0 700.0 405.0" fill="none" stroke="#111111" stroke-width="3.12" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640.0" y="332.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="677.0" y="345.0" text-anchor="middle" font-size="10" fill="#111111">J3 +0.222</text>
<rect x="440.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="482.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E1<title>E1</title></text>
<rect x="570.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="612.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E2<title>E2</title></text>
<rect x="700.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="742.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E3<title>E3</title></text>
</g>
<g aria-label="3. Cycle component">
<rect x="816.0" y="180.0" width="360.0" height="365.0" fill="#ffffff" stroke="#777777" stroke-width="0.8"/>
<text class="serif" x="832.0" y="207" font-size="17" font-weight="700" fill="#111111">3. Cycle component</text>
<text class="serif" x="832.0" y="230" font-size="12" fill="#333333">Remaining alternative-path structure (F_cycle)</text>
<path d="M 908.0 405.0 Q 931.0 327.0 954.0 405.0" fill="none" stroke="#111111" stroke-width="2.50" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="894.0" y="332.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="931.0" y="345.0" text-anchor="middle" font-size="10" fill="#111111">J1 +0.111</text>
<path d="M 908.0 405.0 Q 996.0 309.0 1084.0 405.0" fill="none" stroke="#111111" stroke-width="2.50" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="959.0" y="314.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="996.0" y="327.0" text-anchor="middle" font-size="10" fill="#111111">J2 -0.111</text>
<path d="M 1038.0 405.0 Q 1061.0 327.0 1084.0 405.0" fill="none" stroke="#111111" stroke-width="2.50" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1024.0" y="332.0" width="74" height="19" fill="#ffffff" stroke="#999999" stroke-width="0.6"/>
<text class="mono" x="1061.0" y="345.0" text-anchor="middle" font-size="10" fill="#111111">J3 +0.111</text>
<rect x="824.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="866.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E1<title>E1</title></text>
<rect x="954.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="996.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E2<title>E2</title></text>
<rect x="1084.0" y="384.0" width="84.0" height="42.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text class="serif" x="1126.0" y="410.0" text-anchor="middle" font-size="13" fill="#111111">E3<title>E3</title></text>
</g>
<text class="serif" x="48" y="585" font-size="17" font-weight="700" fill="#111111">Junction values (same edge order in every panel)</text>
<line x1="48" y1="601" x2="1176.0" y2="601" stroke="#111111" stroke-width="1"/>
<text class="serif" x="60" y="628" font-size="12" font-weight="700" fill="#111111">ID</text>
<text class="serif" x="112" y="628" font-size="12" font-weight="700" fill="#111111">Junction</text>
<text class="serif" x="477.4" y="628" font-size="12" font-weight="700" fill="#111111">Read support</text>
<text class="serif" x="673.2" y="628" font-size="12" font-weight="700" fill="#111111">Observed F</text>
<text class="serif" x="856.8" y="628" font-size="12" font-weight="700" fill="#111111">Gradient F_grad</text>
<text class="serif" x="1040.4" y="628" font-size="12" font-weight="700" fill="#111111">Cycle F_cycle</text>
<line x1="48" y1="636" x2="1176.0" y2="636" stroke="#777777" stroke-width="0.7"/>
<text class="serif" x="60" y="650.0" font-size="12" fill="#111111">J1</text>
<text class="serif" x="112" y="650.0" font-size="12" fill="#111111">E1 → E2</text>
<text class="mono" x="477.4" y="650.0" font-size="11" fill="#111111">100</text>
<text class="mono" x="673.2" y="650.0" font-size="11" fill="#111111">+0.3333</text>
<text class="mono" x="856.8" y="650.0" font-size="11" fill="#111111">+0.2222</text>
<text class="mono" x="1040.4" y="650.0" font-size="11" fill="#111111">+0.1111</text>
<line x1="48" y1="658.0" x2="1176.0" y2="658.0" stroke="#cccccc" stroke-width="0.5"/>
<text class="serif" x="60" y="676.0" font-size="12" fill="#111111">J2</text>
<text class="serif" x="112" y="676.0" font-size="12" fill="#111111">E1 → E3</text>
<text class="mono" x="477.4" y="676.0" font-size="11" fill="#111111">100</text>
<text class="mono" x="673.2" y="676.0" font-size="11" fill="#111111">+0.3333</text>
<text class="mono" x="856.8" y="676.0" font-size="11" fill="#111111">+0.4444</text>
<text class="mono" x="1040.4" y="676.0" font-size="11" fill="#111111">-0.1111</text>
<line x1="48" y1="684.0" x2="1176.0" y2="684.0" stroke="#cccccc" stroke-width="0.5"/>
<text class="serif" x="60" y="702.0" font-size="12" fill="#111111">J3</text>
<text class="serif" x="112" y="702.0" font-size="12" fill="#111111">E2 → E3</text>
<text class="mono" x="477.4" y="702.0" font-size="11" fill="#111111">100</text>
<text class="mono" x="673.2" y="702.0" font-size="11" fill="#111111">+0.3333</text>
<text class="mono" x="856.8" y="702.0" font-size="11" fill="#111111">+0.2222</text>
<text class="mono" x="1040.4" y="702.0" font-size="11" fill="#111111">+0.1111</text>
<line x1="48" y1="710.0" x2="1176.0" y2="710.0" stroke="#cccccc" stroke-width="0.5"/>
<line x1="48" y1="750.0" x2="1176.0" y2="750.0" stroke="#111111" stroke-width="1"/>
<text class="serif" x="48" y="778.0" font-size="12" fill="#222222">Observed signal = gradient component + cycle component. Signs are relative to the stored edge direction.</text>
<text class="serif" x="48" y="800.0" font-size="12" font-style="italic" fill="#444444">Cycle-space structure alone does not establish circular RNA or disease causation.</text>
</svg>
