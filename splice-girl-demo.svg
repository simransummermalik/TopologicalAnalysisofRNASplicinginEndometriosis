<svg xmlns="http://www.w3.org/2000/svg" width="980" height="772" viewBox="0 0 980 772" role="img" aria-labelledby="title description">
<title id="title">Splice graph for sample case_02 and gene GENE_DEMO</title>
<desc id="description">A directed splice graph. Arrow thickness represents junction support and arrow color represents the signed Hodge cycle component.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fff9fb"/>
    <stop offset="100%" stop-color="#f7e7ef"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4d203b" flood-opacity="0.16"/>
  </filter>
  <marker id="arrow-positive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b12a76"/>
  </marker>
  <marker id="arrow-negative" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#167b86"/>
  </marker>
  <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#786b75"/>
  </marker>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</defs>
<rect width="100%" height="100%" rx="22" fill="url(#background)"/>
<rect x="1.5" y="1.5" width="977" height="769" rx="21" fill="none" stroke="#c997b2" stroke-width="3"/>

<text class="sans" x="52" y="55" font-size="27" font-weight="750" fill="#65334f">SPLICE GIRL · GRAPH VIEW</text>
<text class="sans" x="52" y="91" font-size="18" fill="#73465e">Sample: <tspan font-weight="700">case_02</tspan>   ·   Gene: <tspan font-weight="700">GENE_DEMO</tspan></text>
<g filter="url(#shadow)">
  <rect x="52.0" y="116" width="172" height="82" rx="14" fill="#fffdfd" stroke="#dab3c7"/>
</g>
<text class="sans" x="69.0" y="143" font-size="12" font-weight="750" letter-spacing="1.1" fill="#8a5b74">CYCLE FRACTION</text>
<text class="sans" x="69.0" y="180" font-size="26" font-weight="750" fill="#552941">11.1%</text>
<g filter="url(#shadow)">
  <rect x="250.0" y="116" width="172" height="82" rx="14" fill="#fffdfd" stroke="#dab3c7"/>
</g>
<text class="sans" x="267.0" y="143" font-size="12" font-weight="750" letter-spacing="1.1" fill="#8a5b74">NODES</text>
<text class="sans" x="267.0" y="180" font-size="26" font-weight="750" fill="#552941">3</text>
<g filter="url(#shadow)">
  <rect x="448.0" y="116" width="172" height="82" rx="14" fill="#fffdfd" stroke="#dab3c7"/>
</g>
<text class="sans" x="465.0" y="143" font-size="12" font-weight="750" letter-spacing="1.1" fill="#8a5b74">JUNCTIONS</text>
<text class="sans" x="465.0" y="180" font-size="26" font-weight="750" fill="#552941">3</text>
<g filter="url(#shadow)">
  <rect x="646.0" y="116" width="172" height="82" rx="14" fill="#fffdfd" stroke="#dab3c7"/>
</g>
<text class="sans" x="663.0" y="143" font-size="12" font-weight="750" letter-spacing="1.1" fill="#8a5b74">MATH CHECKS</text>
<text class="sans" x="663.0" y="180" font-size="26" font-weight="750" fill="#552941">PASS</text>
<text class="sans" x="52" y="243" font-size="14" font-weight="700" fill="#65334f">HOW TO READ THE GRAPH</text>
<line x1="52" y1="266" x2="102" y2="266" stroke="#786b75" stroke-width="7" stroke-linecap="round"/>
<text class="sans" x="113" y="271" font-size="14" fill="#4d3543">thicker arrow = more supporting reads</text>
<line x1="395" y1="266" x2="445" y2="266" stroke="#b12a76" stroke-width="5" stroke-linecap="round"/>
<text class="sans" x="456" y="271" font-size="14" fill="#4d3543">positive cycle contribution</text>
<line x1="695" y1="266" x2="745" y2="266" stroke="#167b86" stroke-width="5" stroke-linecap="round"/>
<text class="sans" x="756" y="271" font-size="14" fill="#4d3543">negative cycle contribution</text>
<text class="sans" x="52" y="310" font-size="18" font-weight="700" fill="#65334f">Observed splice junctions</text>
<path d="M 178.0 420.0 Q 205.0 324.0 232.0 420.0" fill="none" stroke="#b12a76" stroke-width="8.00" stroke-linecap="round" opacity="0.88" marker-end="url(#arrow-positive)"/>
<rect x="189.0" y="349.0" width="32" height="22" rx="8" fill="#fffdfd" stroke="#b12a76" stroke-width="1.5"/>
<text class="mono" x="205.0" y="364.0" text-anchor="middle" font-size="11" font-weight="750" fill="#b12a76">J1</text>
<path d="M 178.0 420.0 Q 290.0 296.0 402.0 420.0" fill="none" stroke="#167b86" stroke-width="8.00" stroke-linecap="round" opacity="0.88" marker-end="url(#arrow-negative)"/>
<rect x="274.0" y="335.0" width="32" height="22" rx="8" fill="#fffdfd" stroke="#167b86" stroke-width="1.5"/>
<text class="mono" x="290.0" y="350.0" text-anchor="middle" font-size="11" font-weight="750" fill="#167b86">J2</text>
<path d="M 348.0 420.0 Q 375.0 324.0 402.0 420.0" fill="none" stroke="#b12a76" stroke-width="8.00" stroke-linecap="round" opacity="0.88" marker-end="url(#arrow-positive)"/>
<rect x="359.0" y="349.0" width="32" height="22" rx="8" fill="#fffdfd" stroke="#b12a76" stroke-width="1.5"/>
<text class="mono" x="375.0" y="364.0" text-anchor="middle" font-size="11" font-weight="750" fill="#b12a76">J3</text>
<g filter="url(#shadow)">
  <rect x="62.0" y="393.0" width="116.0" height="54.0" rx="14" fill="#fffdfd" stroke="#8d5574" stroke-width="2.5"/>
</g>
<text class="mono" x="120.0" y="425.0" text-anchor="middle" font-size="14" font-weight="700" fill="#552941">E1<title>E1</title></text>
<g filter="url(#shadow)">
  <rect x="232.0" y="393.0" width="116.0" height="54.0" rx="14" fill="#fffdfd" stroke="#8d5574" stroke-width="2.5"/>
</g>
<text class="mono" x="290.0" y="425.0" text-anchor="middle" font-size="14" font-weight="700" fill="#552941">E2<title>E2</title></text>
<g filter="url(#shadow)">
  <rect x="402.0" y="393.0" width="116.0" height="54.0" rx="14" fill="#fffdfd" stroke="#8d5574" stroke-width="2.5"/>
</g>
<text class="mono" x="460.0" y="425.0" text-anchor="middle" font-size="14" font-weight="700" fill="#552941">E3<title>E3</title></text>
<text class="sans" x="52" y="520" font-size="18" font-weight="700" fill="#65334f">Junction details</text>
<text class="sans" x="66" y="550" font-size="12" font-weight="750" letter-spacing="0.8" fill="#8a5b74">ID</text>
<text class="sans" x="125" y="550" font-size="12" font-weight="750" letter-spacing="0.8" fill="#8a5b74">FROM → TO</text>
<text class="sans" x="390" y="550" font-size="12" font-weight="750" letter-spacing="0.8" fill="#8a5b74">READ SUPPORT</text>
<text class="sans" x="565" y="550" font-size="12" font-weight="750" letter-spacing="0.8" fill="#8a5b74">NORMALIZED SIGNAL</text>
<text class="sans" x="785" y="550" font-size="12" font-weight="750" letter-spacing="0.8" fill="#8a5b74">CYCLE COMPONENT</text>
<rect x="52" y="552.0" width="876" height="25" rx="6" fill="#fffafd"/>
<text class="mono" x="66" y="570.0" font-size="12" font-weight="750" fill="#b12a76">J1</text>
<text class="mono" x="125" y="570.0" font-size="12" fill="#4d3543">E1 → E2</text>
<text class="mono" x="390" y="570.0" font-size="12" fill="#4d3543">100</text>
<text class="mono" x="565" y="570.0" font-size="12" fill="#4d3543">0.3333</text>
<text class="mono" x="785" y="570.0" font-size="12" font-weight="700" fill="#b12a76">+0.1111</text>
<rect x="52" y="581.0" width="876" height="25" rx="6" fill="#f8edf3"/>
<text class="mono" x="66" y="599.0" font-size="12" font-weight="750" fill="#167b86">J2</text>
<text class="mono" x="125" y="599.0" font-size="12" fill="#4d3543">E1 → E3</text>
<text class="mono" x="390" y="599.0" font-size="12" fill="#4d3543">100</text>
<text class="mono" x="565" y="599.0" font-size="12" fill="#4d3543">0.3333</text>
<text class="mono" x="785" y="599.0" font-size="12" font-weight="700" fill="#167b86">-0.1111</text>
<rect x="52" y="610.0" width="876" height="25" rx="6" fill="#fffafd"/>
<text class="mono" x="66" y="628.0" font-size="12" font-weight="750" fill="#b12a76">J3</text>
<text class="mono" x="125" y="628.0" font-size="12" fill="#4d3543">E2 → E3</text>
<text class="mono" x="390" y="628.0" font-size="12" fill="#4d3543">100</text>
<text class="mono" x="565" y="628.0" font-size="12" fill="#4d3543">0.3333</text>
<text class="mono" x="785" y="628.0" font-size="12" font-weight="700" fill="#b12a76">+0.1111</text>
<line x1="52" y1="684.0" x2="928.0" y2="684.0" stroke="#d7afc3" stroke-width="1.5"/>
<text class="sans" x="52" y="718.0" font-size="15" fill="#5f4352">Cycle fraction = cycle energy ÷ total signal energy. Edge signs follow the stored arrow direction.</text>
<text class="sans" x="52" y="745.0" font-size="14" fill="#765e6b">A cycle-space signal can reveal alternative-path structure; by itself, it does not prove circular RNA or disease causation.</text>
</svg>
